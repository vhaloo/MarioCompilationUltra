plugins { id 'com.android.application' }

def sdl = file(providers.gradleProperty('mcuSdlDir').getOrElse('../.deps/SDL2-2.32.10'))
if (System.getenv('MCU_ANDROID_BUILD_DIR')) layout.buildDirectory.set(file(System.getenv('MCU_ANDROID_BUILD_DIR')))

def generatedAssets = layout.buildDirectory.dir('generated/mcu-assets')
def privateAssets = providers.gradleProperty('mcuPrivateAssets').orNull
def keyFile = providers.gradleProperty('mcuKeyStore').orElse(providers.environmentVariable('MCU_QUEST_KEYSTORE')).orNull
android {
    namespace 'com.vhaloo.mariocompilationultra.quest'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'com.vhaloo.mariocompilationultra.quest'
        minSdk 29
        targetSdk 32
        versionCode 500
        versionName '0.5.0-xr-preview'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DBUILD_TESTING=OFF', '-DANDROID_STL=c++_shared', '-DMCU_BUILD_QUEST=ON',
                    "-DMCU_SDL_SOURCE=${sdl.absolutePath.replace('\\','/')}", '-DMCU_FETCH_SDL=OFF'
                targets 'MarioCompilationUltra', 'SDL2'
                cppFlags '-std=c++17'
            }
        }
    }
    signingConfigs {
        if (keyFile) {
            portable {
                storeFile file(keyFile)
                storePassword providers.environmentVariable('MCU_QUEST_KEY_PASSWORD').get()
                keyAlias 'mcu-quest'
                keyPassword providers.environmentVariable('MCU_QUEST_KEY_PASSWORD').get()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile ? signingConfigs.portable : signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; buildStagingDirectory file(providers.environmentVariable("MCU_NATIVE_BUILD_DIR").getOrElse(".cxx")); version '3.31.6' } }
    buildFeatures { prefab true; buildConfig false }
    sourceSets {
        main {
            java.srcDir new File(sdl, 'android-project/app/src/main/java')
            assets.srcDir generatedAssets.get().asFile
            if (privateAssets) assets.srcDir file(privateAssets)
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true; lintConfig file('lint.xml'); disable 'ExpiredTargetSdkVersion' }
}
tasks.register('prepareMcuAssets', Sync) {
    from('../../assets') { into 'mcu/assets' }
    from('../../docs') { into 'mcu/docs' }
    from('../../LICENSE') { into 'mcu/licences' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'mcu/licences' }
    from('../../licenses') { into 'mcu/licences' }
    into generatedAssets
}
tasks.named('preBuild').configure { dependsOn 'prepareMcuAssets' }
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.65' }
